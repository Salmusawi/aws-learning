<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the Cloud</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem 1.2rem; font-size: 1rem; }
    #answer { margin-top: 1.5rem; white-space: pre-wrap; color: #555; }
  </style>
</head>
<body>
  <h1>Ask the Cloud</h1>
  <p>Deployed with Terraform to S3 in eu-north-1.</p>

  <form id="ask">
    <input id="question" placeholder="What is an S3 bucket?" required>
    <button>Ask</button>
  </form>
  <div id="answer"></div>

  <script>
    // Stage 1: there is no backend yet. Stage 2 will replace this with a call to our API.
    document.getElementById("ask").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("answer").textContent =
        "The backend isn't connected yet. That's Stage 2!";
    });
  </script>
</body>
</html>
